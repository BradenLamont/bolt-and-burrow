<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolt &amp; Burrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app" id="app">
  <header class="topbar" aria-label="Status">
    <div class="hud">
      <div class="readout">
        <small>Depth</small>
        <b id="depth">0 m</b>
        <span id="biome">Town</span>
      </div>
      <div class="meters">
        <div class="meter"><span>Battery</span><div class="bar"><i id="batBar"></i><u id="batMark" hidden></u></div><em id="batTxt">80</em></div>
        <div class="meter"><span>Hull</span><div class="bar hull"><i id="hullBar"></i></div><em id="hullTxt">60</em></div>
        <div class="meter"><span>Cargo</span><div class="bar cargo"><i id="cargoBar"></i></div><em id="cargoTxt">0/8</em></div>
      </div>
      <div class="readout end">
        <small>Coins</small>
        <b id="coins">0</b>
        <span id="flux" hidden>0 Flux</span>
      </div>
      <div class="sysbtns">
        <button id="fsBtn" type="button" title="Full screen" aria-label="Full screen" hidden>&#x26F6;</button>
        <button id="pauseBtn" type="button" title="Pause menu (Esc)" aria-label="Pause menu">&#x23F8;</button>
      </div>
    </div>
    <div class="tip" id="tipBox" role="status" aria-live="polite"><p id="tip"></p></div>
  </header>

  <section class="stage" id="stage" aria-label="Cave">
    <canvas id="world" aria-label="The cave, seen from above. Your base is at the bottom. Use the arrow keys or the touch joystick to move and dig."></canvas>
    <div class="joy" id="joy" hidden><i id="joyKnob"></i></div>
    <canvas class="minimap" id="minimap" aria-label="Map of what you've explored in this cave"></canvas>
    <div class="bossbar" id="bossBar" hidden><span id="bossName">Boss</span><div><i id="bossHp"></i></div></div>

    <aside class="botbox" id="botBox" aria-label="Nano-bots">
      <button class="bot-head" id="botToggle" type="button" aria-expanded="true"><span>Nano-bots</span><span class="chip" id="botTag">None yet</span><i class="caret"></i></button>
      <div class="bot-view" id="botView"><canvas id="bots" aria-label="Your nano-bot at work on the computer's circuit board"></canvas></div>
    </aside>

    <div class="overlay" id="popup" hidden>
      <div class="sheet pop" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="popTitle">
        <header><h2 id="popTitle">Forge car</h2><span class="chip open" id="popChip"></span><button class="x" type="button" data-close aria-label="Close">&#x2715;</button></header>
        <div class="view" id="popBody"></div>
        <footer><span class="keys">W/S or arrows to pick · E to use · E or Esc to close · the game is paused</span><span class="touch">Tap &#x2715; to close · the game is paused</span></footer>
      </div>
    </div>

    <div class="overlay" id="menu" hidden>
      <div class="sheet menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <header><h2 id="menuTitle">Paused</h2><button class="resume" type="button" data-close>Resume</button></header>
        <nav class="tabs" id="menuTabs" role="tablist">
          <button type="button" role="tab" data-tab="mech">Mech &amp; cargo</button>
          <button type="button" role="tab" data-tab="bots">Bots</button>
          <button type="button" role="tab" data-tab="train">Train cars</button>
          <button type="button" role="tab" data-tab="map">Map</button>
          <button type="button" role="tab" data-tab="settings">Settings &amp; hints</button>
        </nav>
        <div class="view" id="menuBody"></div>
      </div>
    </div>
  </section>

  <footer class="bottombar" aria-label="Controls">
    <p class="cue" id="cue"></p>
    <div class="btns">
      <div class="belt" id="belt"></div>
      <button id="attack" type="button" hidden>Attack</button>
      <button id="skill" type="button" hidden><span id="skillName">Skill</span><i><b id="skillBar"></b></i></button>
      <button id="action" type="button" hidden>Action</button>
      <button id="skipTut" type="button" hidden>Skip tutorial</button>
      <button id="recall" type="button">Recall</button>
    </div>
  </footer>
</main>

<!-- Game scripts, in load order. Each file is one part of the game. -->
<script src="js/config.js"></script>  <!-- balance numbers -->
<script src="js/state.js"></script>   <!-- shared state, saving, helpers -->
<script src="js/sound.js"></script>   <!-- sound effects and mute -->
<script src="js/world.js"></script>   <!-- cave generation, conveyor, outposts, relic -->
<script src="js/base.js"></script>    <!-- train base: storage, shop, forge, computer mods -->
<script src="js/player.js"></script>  <!-- robot movement, digging, battery -->
<script src="js/hazards.js"></script> <!-- unstable rock, sand, boulders, water, gas -->
<script src="js/gear.js"></script>    <!-- tool belt and active skills -->
<script src="js/trip.js"></script>    <!-- riding the train between towns -->
<script src="js/combat.js"></script>  <!-- weapon arm, enemies, bosses, hull -->
<script src="js/loot.js"></script>    <!-- ore drops, the magnet, Flux upgrades -->
<script src="js/walker.js"></script>  <!-- the Canopy Walker mech -->
<script src="js/render.js"></script>  <!-- drawing -->
<script src="js/ui.js"></script>      <!-- HUD, tips, station pop-ups -->
<script src="js/menu.js"></script>    <!-- pause menu, settings, full screen -->
<script src="js/contracts.js"></script> <!-- daily contracts board -->
<script src="js/crew.js"></script>    <!-- the nano-bot crew: jobs, the job board, chips, the daily bot-cache -->
<script src="js/crawler.js"></script> <!-- mobile outposts: the crawler ride home, the halfway crawler -->
<script src="js/tutorial.js"></script> <!-- Scout's Cave 1 tutorial -->
<script src="js/input.js"></script>   <!-- keyboard and joystick -->
<script src="js/main.js"></script>    <!-- start-up and main loop -->
</body>
</html>
